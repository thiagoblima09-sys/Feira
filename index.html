<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>VOCÊ ESTÁ ANÔNIMO?</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #020303;
    color: #e8fff1;
    font-family: "Courier New", monospace;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
}

/* FUNDO */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: -2;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(
        circle at center,
        transparent 20%,
        rgba(0,0,0,.72) 100%
    );
    z-index: -1;
}

/* TELA INICIAL */
.screen {
    width: 100%;
    min-height: 100vh;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.screen.active {
    display: flex;
}

.intro {
    width: 100%;
    max-width: 700px;
    text-align: center;
}

.lock {
    font-size: 50px;
    margin-bottom: 30px;
    filter: grayscale(1);
}

.small {
    color: #66736b;
    font-size: 12px;
    letter-spacing: 3px;
    margin-bottom: 20px;
}

h1 {
    font-size: clamp(38px, 10vw, 82px);
    letter-spacing: 8px;
    line-height: 1;
    margin: 0;
}

.subtitle {
    margin-top: 25px;
    color: #8b9990;
    font-family: Arial, sans-serif;
    font-size: 16px;
    line-height: 1.7;
}

/* CAMPO DE NOME */
.name-input {
    margin-top: 35px;
    padding: 15px;
    width: 100%;
    max-width: 300px;
    background: transparent;
    border: 1px solid #52665a;
    color: #dffff0;
    font-family: "Courier New", monospace;
    font-size: 16px;
    text-align: center;
    outline: none;
    transition: 0.3s;
}

.name-input:focus {
    border-color: #9affbd;
    box-shadow: 0 0 15px rgba(0,255,120,.15);
}

.name-input::placeholder {
    color: #344139;
}

.start {
    margin-top: 20px;
    padding: 17px 35px;
    border: 1px solid #52665a;
    background: transparent;
    color: #dffff0;
    font-family: "Courier New", monospace;
    font-size: 14px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: .3s;
    display: inline-block;
}

.start:hover {
    background: #dffff0;
    color: #020303;
}

/* TERMINAL */
.terminal {
    width: 100%;
    max-width: 850px;
}

.terminal-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 15px;
    border: 1px solid #26332b;
    border-bottom: none;
    background: #080b09;
}

.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #47534c;
}

.terminal-title {
    margin-left: 8px;
    color: #69756e;
    font-size: 11px;
    letter-spacing: 2px;
}

.terminal-body {
    border: 1px solid #26332b;
    background: rgba(3,7,5,.92);
    padding: 25px;
    min-height: 500px;
    box-shadow: 0 0 70px rgba(0,255,120,.035);
}

.status {
    color: #728078;
    font-size: 12px;
    margin-bottom: 25px;
}

.status span {
    color: #9affbd;
}

.discovery {
    min-height: 320px;
}

.line {
    margin: 14px 0;
    opacity: 0;
    transform: translateY(8px);
    animation: lineIn .6s forwards;
}

@keyframes lineIn {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.prompt {
    color: #506058;
}

.value {
    color: #d8ffe5;
}

.label {
    color: #819087;
}

.progress-container {
    height: 2px;
    background: #182019;
    margin-top: 30px;
    overflow: hidden;
}

.progress {
    height: 100%;
    width: 0;
    background: #b8ffce;
    transition: width .8s ease;
}

/* REVELAÇÃO */
.reveal {
    width: 100%;
    max-width: 800px;
    text-align: center;
}

.reveal-number {
    color: #65736b;
    font-size: 12px;
    letter-spacing: 4px;
    margin-bottom: 35px;
}

.reveal h2 {
    font-family: Arial, sans-serif;
    font-size: clamp(30px, 7vw, 65px);
    line-height: 1.1;
    margin: 0;
}

.reveal p {
    margin: 35px auto 0;
    max-width: 650px;
    color: #8c9991;
    font-family: Arial, sans-serif;
    font-size: 16px;
    line-height: 1.8;
}

.final {
    margin-top: 45px;
    color: #e5ffed;
    font-size: clamp(20px, 4vw, 32px);
    line-height: 1.5;
}

.highlight {
    color: white;
    font-weight: bold;
}

.restart {
    margin-top: 45px;
    padding: 12px 25px;
    background: transparent;
    border: 1px solid #344139;
    color: #77857c;
    cursor: pointer;
    font-family: monospace;
}

/* ================= GLITCH ================= */
.glitch {
    display: inline-block;
    animation: glitch-anim 2.5s infinite;
}

@keyframes glitch-anim {
    0%, 14%, 16%, 44%, 46%, 74%, 76%, 100% {
        text-shadow: none;
        transform: skew(0deg);
        opacity: 1;
    }
    15% {
        text-shadow: 4px 0px #ff0055, -4px 0px #00ffaa;
        transform: skew(-15deg);
    }
    45% {
        text-shadow: -3px 0px #ff0055, 3px 0px #00ffaa;
        transform: skew(5deg);
    }
    75% {
        text-shadow: 3px 3px #ff0055, -3px -3px #00ffaa;
        transform: skew(-5deg);
        opacity: 0.8;
    }
}

/* MOBILE */
@media (max-width: 600px) {
    .terminal-body {
        padding: 18px;
        min-height: 480px;
    }
    h1 {
        letter-spacing: 5px;
    }
    .line {
        font-size: 12px;
        line-height: 1.6;
    }
}
</style>
</head>

<body>

<!-- ================= INTRO ================= -->
<section id="intro" class="screen active">
    <div class="intro">
        <div class="lock">◉</div>
        <div class="small">EXPERIÊNCIA DIGITAL</div>
        <h1>VOCÊ ESTÁ<br>ANÔNIMO?</h1>
        <div class="subtitle">
            Para iniciar a simulação e acessar o relatório do seu dispositivo,<br>
            insira seu primeiro nome abaixo.
        </div>
        
        <!-- O TRUQUE DA ENGENHARIA SOCIAL AQUI -->
        <input type="text" id="userName" class="name-input" placeholder="SEU NOME (OPCIONAL)" autocomplete="off">
        <br>
        <button class="start" onclick="startExperience()">
            ENTRAR NA EXPERIÊNCIA
        </button>
    </div>
</section>

<!-- ================= TERMINAL ================= -->
<section id="scan" class="screen">
    <div class="terminal">
        <div class="terminal-header">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="terminal-title">DIGITAL ENVIRONMENT ANALYSIS</div>
        </div>
        <div class="terminal-body">
            <div class="status">
                <span>● SISTEMA ONLINE</span>
                <br><br>
                iniciando análise do ambiente digital...
            </div>
            <div id="discovery" class="discovery"></div>
            <div class="progress-container">
                <div id="progress" class="progress"></div>
            </div>
        </div>
    </div>
</section>

<!-- ================= REVELAÇÃO ================= -->
<section id="reveal" class="screen">
    <div class="reveal">
        <div class="reveal-number">ANÁLISE CONCLUÍDA</div>
        <h2 id="revealTitle"></h2>
        <p id="revealText"></p>
        <div class="final" id="finalText"></div>
        <button class="restart" onclick="location.reload()">
            ↻ EXPERIÊNCIA NOVAMENTE
        </button>
    </div>
</section>

<script>
// Variável global para armazenar o nome digitado
let capturedName = "";

/* =====================================================
   TRANSIÇÃO ENTRE TELAS
===================================================== */
function showScreen(id) {
    document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
    });
    document.getElementById(id).classList.add("active");
}

/* =====================================================
   DETECÇÃO DE INFORMAÇÕES LOCAIS
===================================================== */
function getBrowser() {
    const ua = navigator.userAgent;
    if (/Edg/i.test(ua)) return "Microsoft Edge";
    if (/OPR/i.test(ua)) return "Opera";
    if (/Chrome/i.test(ua) && !/Edg/i.test(ua)) return "Google Chrome";
    if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) return "Safari";
    if (/Firefox/i.test(ua)) return "Mozilla Firefox";
    return "Navegador não identificado";
}

function getDevice() {
    const ua = navigator.userAgent.toLowerCase();
    if (/ipad/.test(ua)) return "Tablet";
    if (/tablet/.test(ua)) return "Tablet";
    if (/iphone|android|mobile/.test(ua)) return "Smartphone";
    return "Computador";
}

function getSystem() {
    const ua = navigator.userAgent;
    if (/iPhone|iPad|iPod/i.test(ua)) return "Apple iOS";
    if (/Android/i.test(ua)) return "Android";
    if (/Mac/i.test(ua)) return "macOS";
    if (/Windows/i.test(ua)) return "Windows";
    if (/Linux/i.test(ua)) return "Linux";
    return "Sistema não identificado";
}

/* =====================================================
   INÍCIO DA EXPERIÊNCIA
===================================================== */
function startExperience() {
    // Captura o nome, remove espaços nas bordas. Se tiver vazio, fica vazio.
    capturedName = document.getElementById("userName").value.trim();
    
    showScreen("scan");
    setTimeout(runAnalysis, 1000);
}

/* =====================================================
   ANÁLISE CINEMATOGRÁFICA (ASYNC)
===================================================== */
async function runAnalysis() {
    const discovery = document.getElementById("discovery");
    const progress = document.getElementById("progress");

    discovery.innerHTML = '<div class="status" style="margin-bottom: 15px; color: #506058;">[estabelecendo handshake de rede e hardware...]</div>';

    let ipData = { ip: "Restrito/Oculto", city: "Desconhecida", region: "Desconhecida", isp: "Não identificado" };

    try {
        const response = await fetch('https://ipapi.co/json/');
        if (response.ok) {
            const apiResult = await response.json();
            ipData.ip = apiResult.ip || ipData.ip;
            ipData.city = apiResult.city || ipData.city;
            ipData.region = apiResult.region || ipData.region;
            ipData.isp = apiResult.org || ipData.isp;
        }
    } catch (error) {
        console.warn("Rastreamento de IP bloqueado.");
    }

    let batteryInfo = "Restrito pelo Sistema";
    if ('getBattery' in navigator) {
        try {
            const battery = await navigator.getBattery();
            const level = Math.round(battery.level * 100) + "%";
            const charging = battery.charging ? " [Conectado]" : " [Uso de bateria]";
            batteryInfo = level + charging;
        } catch (error) {}
    }

    discovery.innerHTML = '';

    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || "Não identificado";
    const language = navigator.language || "Não identificado";
    const screenSize = window.screen.width + " × " + window.screen.height;
    
    // Adiciona o nome digitado na tela do terminal, caso ele tenha fornecido
    const data = [];
    if (capturedName !== "") {
        data.push({ label: "USUÁRIO IDENTIFICADO", value: capturedName.toUpperCase() });
    }

    data.push(
        { label: "ENDEREÇO IP", value: ipData.ip },
        { label: "LOCALIZAÇÃO APROX.", value: `${ipData.city} / ${ipData.region}` },
        { label: "PROVEDOR DE INTERNET", value: ipData.isp },
        { label: "DISPOSITIVO", value: getDevice() },
        { label: "SISTEMA OPERACIONAL", value: getSystem() },
        { label: "NAVEGADOR", value: getBrowser() },
        { label: "NÍVEL DE BATERIA", value: batteryInfo },
        { label: "IDIOMA", value: language },
        { label: "FUSO HORÁRIO", value: timezone },
        { label: "RESOLUÇÃO DA TELA", value: screenSize }
    );

    let i = 0;

    function next() {
        if (i >= data.length) {
            progress.style.width = "100%";
            setTimeout(() => showReveal(ipData.city, batteryInfo), 2200);
            return;
        }

        const item = data[i];
        const div = document.createElement("div");
        div.className = "line";
        div.innerHTML = `<span class="prompt">></span> <span class="label">${item.label}: </span><span class="value">${item.value}</span>`;

        discovery.appendChild(div);

        const percentage = ((i + 1) / data.length) * 100;
        progress.style.width = percentage + "%";

        i++;
        setTimeout(next, 650);
    }

    next();
}

/* =====================================================
   REVELAÇÃO FINAL (ADAPTATIVA COM O NOME)
===================================================== */
function showReveal(city, battery) {
    showScreen("reveal");

    const title = document.getElementById("revealTitle");
    const text = document.getElementById("revealText");
    const final = document.getElementById("finalText");

    title.classList.remove("glitch");
    final.innerHTML = "";

    // Lógica da Engenharia Social: Verifica se a pessoa caiu no truque
    if (capturedName !== "") {
        title.innerHTML = `Obrigado,<br>${capturedName}.`;
        text.innerHTML = "Você me deu o seu nome de forma voluntária.<br>Eu não precisei roubá-lo.<br>As pessoas entregam seus dados básicos em troca de qualquer acesso.";
    } else {
        title.innerHTML = "Você não forneceu<br>seu nome.";
        text.innerHTML = "Não usamos câmera.<br>Não pedimos sua senha.<br>Não precisamos saber quem você é.";
    }

    // Quebra de expectativa e Glitch
    setTimeout(() => {
        title.innerHTML = "Mesmo assim,<br>você deixou rastros reais.";
        title.classList.add("glitch");
    }, 5000);

    // Mostrando os dados capturados
    setTimeout(() => {
        let locationText = city !== "Desconhecida" 
            ? `Sabemos que você acessa da região de <span style="color: #fff;">${city}</span>.` 
            : "Seu endereço IP revelou seu provedor e rede.";
            
        let batteryText = battery !== "Restrito pelo Sistema" 
            ? `<br>Sua bateria está operando em exatos <span style="color: #fff;">${battery}</span>.` 
            : "";

        text.innerHTML = locationText + batteryText + 
            "<br><br>Seu dispositivo entrega essas informações silenciosamente para qualquer site que você visita.";
    }, 8500);

    // Conclusão 1
    setTimeout(() => {
        final.innerHTML = "Na era digital,<br><span class='highlight glitch'>anonimato não significa ausência de rastros.</span>";
    }, 13500);

    // Conclusão 2
    setTimeout(() => {
        final.innerHTML = "A pergunta não é apenas<br><span class='highlight glitch'>“o que você publicou?”</span><br><br>É também:<br><span class='highlight glitch'>“o que você revelou sem perceber?”</span>";
    }, 18000);
}
</script>

</body>
</html>
